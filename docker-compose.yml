services:
  reporting-service-db:
    image: postgres:17
    container_name: reporting-service-db
    environment:
      POSTGRES_DB: report_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - reporting_service_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d report_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  reporting-service:
    build: .
    container_name: reporting-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://reporting-service-db:5432/report_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      reporting-service-db:
        condition: service_healthy
    networks:
      - default
      - platform-net

volumes:
  reporting_service_pgdata:

networks:
  platform-net:
    external: true   # create once: docker network create platform-net
