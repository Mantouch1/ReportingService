
# === Application ===
spring.application.name=reporting-service

# === Server Port ===
server.port=8086

# === PostgreSQL Database Configuration ===
# Local: localhost:5432
# Docker: reporting-postgres:5432

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/report_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1111}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate Configuration ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# === JWT Configuration ===
# Must be identical to IdentityService
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_THE_SAME_SECRET_AS_IDENTITY_SERVICE}

# === Actuator ===
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true  
